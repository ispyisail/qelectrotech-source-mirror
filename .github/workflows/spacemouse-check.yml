# Builds SpaceMouse Check on a macOS runner, smoke-tests it (no device
# there), and publishes the zip as a release anyone can download.
name: SpaceMouse Check (macOS)
on:
  push:
    branches: [tools/spacemouse-check-mac]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sh build.sh
      - name: Self-test (no device on the runner)
        run: |
          build/SpaceMouseCheck.app/Contents/MacOS/SpaceMouseCheck --selftest selftest.json
          python3 -c "import json; d=json.load(open('selftest.json')); assert d['hid_route']['open'] == 'no 3D mouse found', d; assert 'environment' in d; print('selftest ok')"
          file build/SpaceMouseCheck.app/Contents/MacOS/SpaceMouseCheck
          codesign --verify --verbose build/SpaceMouseCheck.app
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMouseCheck
          path: build/SpaceMouseCheck.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=spacemouse-check-v1
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "SpaceMouse Check for macOS" \
              --notes "Diagnostic app for QElectroTech's 3D mouse support on macOS. See README."
          gh release upload "$tag" build/SpaceMouseCheck.zip --clobber

  # Same app, on a runner with 3Dconnexion's real macOS driver installed.
  # No device, so no motion: this proves the app loads the framework and
  # registers with 3DxWare without crashing, and shows what 3DxWare installs.
  with-3dxware:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sh build.sh
      - name: Install 3DxWare 10.8.13
        run: |
          curl -sSfL -o 3dx.dmg "https://download.3dconnexion.com/drivers/mac/10-8-13_A881DAA9/3DxWareMac_v10-8-13_r3908.dmg"
          hdiutil attach -nobrowse -mountpoint /Volumes/3dx 3dx.dmg
          ls -la /Volumes/3dx
          pkg=$(find /Volumes/3dx -maxdepth 2 -name '*.pkg' -o -maxdepth 2 -name '*.mpkg' | head -1)
          echo "installing $pkg"
          sudo installer -pkg "$pkg" -target / -verbose
          # The installer asks for a restart, which a runner cannot do; start
          # whatever launchd jobs it installed by hand instead.
          ls -la /Library/LaunchAgents /Library/LaunchDaemons | grep -i 3dconn || true
          ls /Applications /Applications/3Dconnexion 2>/dev/null | grep -i 3d || true
          for f in /Library/LaunchDaemons/*3dconnexion* /Library/LaunchDaemons/*3Dconnexion*; do
            [ -f "$f" ] && { echo "daemon $f"; cat "$f"; sudo launchctl bootstrap system "$f" || true; }
          done
          for f in /Library/LaunchAgents/*3dconnexion* /Library/LaunchAgents/*3Dconnexion*; do
            [ -f "$f" ] && { echo "agent $f"; cat "$f"; launchctl bootstrap gui/$(id -u) "$f" || true; }
          done
          sleep 20
          ls /Library/Frameworks | grep -i 3dconn || true
          ps -A -o pid=,comm= | grep -i 3dx || true
          systemextensionsctl list || true
          kextstat -l 2>/dev/null | grep -i 3dconn || true
      - name: Self-test with 3DxWare
        run: |
          build/SpaceMouseCheck.app/Contents/MacOS/SpaceMouseCheck --selftest selftest.json
          python3 -c "import json; d=json.load(open('selftest.json'))['driver_route']; print(d); assert d.get('load') == 'ok', d"
          # set_handlers is -36 here: 3DxWare's DriverKit extension stays
          # "activated waiting for user", which only a click in System Settings
          # clears, so its helper has no device service to talk to.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-with-3dxware
          path: selftest.json

  # QElectroTech itself with the 3DxWare backend (branch
  # feat/spacemouse-3dxware-macos), on a runner with 3DxWare installed.
  qet-with-3dxware:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ispyisail/qelectrotech-source-mirror
          ref: feat/spacemouse-3dxware-macos
          path: qet
      - name: Dependencies
        run: brew install qt hidapi ninja pkg-config
      - name: Build (Qt 6, 3D mouse on, no KDE)
        run: |
          cmake -S qet -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_VERSION_MAJOR=6 \
            -DBUILD_WITH_KF=OFF -DQET_ENABLE_SPACEMOUSE=ON -DQET_SPACEMOUSE_BACKEND=hid \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" 2>&1 | grep -iE "spacemouse|error" || true
          cmake --build build
      - name: Tests
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
      - name: Install 3DxWare 10.8.13
        run: |
          curl -sSfL -o 3dx.dmg "https://download.3dconnexion.com/drivers/mac/10-8-13_A881DAA9/3DxWareMac_v10-8-13_r3908.dmg"
          hdiutil attach -nobrowse -mountpoint /Volumes/3dx 3dx.dmg
          sudo installer -pkg "/Volumes/3dx/Install 3Dconnexion software.pkg" -target /
      - name: Entitlement is what lets a hardened app load 3DxWare
        run: |
          t=build/tests/qttest/tst_spacemouseconnexion
          echo "== hardened runtime, no entitlement (expected: refused)"
          codesign --force --sign - --options=runtime "$t"
          if QT_QPA_PLATFORM=offscreen "$t" realLibrary; then no_ent=loaded; else no_ent=refused; fi
          echo "== hardened runtime, with misc/qelectrotech.entitlements (expected: loaded)"
          codesign --force --sign - --options=runtime --entitlements qet/misc/qelectrotech.entitlements "$t"
          QT_QPA_PLATFORM=offscreen "$t" realLibrary
          echo "without entitlement: $no_ent; with: loaded"
          [ "$no_ent" = refused ] || echo "::warning::the check did not discriminate: loaded without the entitlement too"
      - name: QElectroTech starts with 3DxWare installed, and loads it
        run: |
          app=build/qelectrotech.app
          codesign --force --deep --sign - --options=runtime --entitlements qet/misc/qelectrotech.entitlements "$app"
          "$app/Contents/MacOS/qelectrotech" > qet.log 2>&1 &
          pid=$!
          sleep 25
          kill -0 $pid || { echo "QElectroTech exited"; cat qet.log; exit 1; }
          lsof -p $pid | grep -iE "3dconnexion|hidapi" || true
          lsof -p $pid | grep -q 3DconnexionClient || { echo "::error::3DconnexionClient not loaded"; exit 1; }
          kill $pid
